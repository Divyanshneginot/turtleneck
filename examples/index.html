<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Command Hub - UI/UX Skill Demo</title>
  <style>
    /* Design Tokens (8pt grid, semantic colors, modular typography) */
    :root {
      --bg-canvas: #090d16;
      --bg-surface: #111827;
      --bg-surface-elevated: #1f2937;
      --border-subtle: #1f2937;
      --border-strong: #374151;
      --text-primary: #f9fafb;
      --text-secondary: #9ca3af;
      --text-muted: #6b7280;
      --action-primary: #3b82f6;
      --action-primary-hover: #60a5fa;
      --action-primary-active: #2563eb;
      --status-success: #22c55e;
      --status-warning: #f59e0b;
      --status-danger: #ef4444;
      --radius-sm: 6px;
      --radius-md: 10px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4), 0 2px 4px -2px rgb(0 0 0 / 0.3);
    }

    /* Reset & Base */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      line-height: 1.5;
      font-size: 16px;
      padding: 32px 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    /* Accessibility: Skip link */
    .skip-link {
      position: absolute;
      top: -40px;
      left: 16px;
      background: var(--action-primary);
      color: #fff;
      padding: 8px 16px;
      z-index: 100;
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-weight: 600;
    }
    .skip-link:focus {
      top: 16px;
    }

    /* Container: 8pt layout constraints */
    .container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 24px;
    }

    .title-group h1 {
      font-size: 28px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .title-group p {
      color: var(--text-secondary);
      font-size: 14px;
      margin-top: 4px;
    }

    /* Metric Grid (8pt spacing) */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
    }

    .metric-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-sm);
    }

    .metric-card .label {
      font-size: 13px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .metric-card .value {
      font-size: 32px;
      font-weight: 700;
      margin: 8px 0;
      letter-spacing: -0.02em;
    }

    .metric-card .trend {
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .trend.positive { color: var(--status-success); }
    .trend.warning { color: var(--status-warning); }

    /* Task Section */
    .section-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 24px;
      box-shadow: var(--shadow-md);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-header h2 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    /* Task List */
    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      min-height: 52px; /* Touch friendly */
      transition: border-color 0.15s ease;
    }

    .task-item:hover {
      border-color: var(--border-strong);
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Accessible Custom Checkbox (min 44px hit-box) */
    .checkbox-wrapper {
      position: relative;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .checkbox-wrapper input[type="checkbox"] {
      appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border-strong);
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      display: grid;
      place-content: center;
      transition: all 0.15s ease;
    }

    .checkbox-wrapper input[type="checkbox"]:checked {
      background: var(--action-primary);
      border-color: var(--action-primary);
    }

    .checkbox-wrapper input[type="checkbox"]:checked::after {
      content: "";
      width: 10px;
      height: 6px;
      border-left: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(-45deg) translate(1px, -1px);
    }

    /* Focus Visible Rule: 2px solid, 2px offset */
    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--action-primary-hover);
      outline-offset: 2px;
    }

    /* Task label and badge */
    .task-label {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .task-item.completed .task-label {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .badge {
      font-size: 12px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-high { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-med { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }

    /* Interactive 5-State Button (Min 44x44px) */
    .btn {
      min-height: 44px;
      min-width: 44px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.12s ease;
    }

    /* Primary Button States */
    .btn-primary {
      background: var(--action-primary);
      color: #ffffff;
    }
    .btn-primary:hover {
      background: var(--action-primary-hover);
    }
    .btn-primary:active {
      background: var(--action-primary-active);
      transform: scale(0.98);
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Secondary Button */
    .btn-secondary {
      background: transparent;
      color: var(--text-primary);
      border-color: var(--border-strong);
    }
    .btn-secondary:hover {
      background: var(--bg-surface-elevated);
      border-color: var(--text-secondary);
    }
    .btn-secondary:active {
      transform: scale(0.98);
    }

    /* Toast Notification (Accessible alert) */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-surface-elevated);
      color: var(--text-primary);
      border: 1px solid var(--action-primary);
      border-radius: var(--radius-sm);
      padding: 12px 18px;
      box-shadow: var(--shadow-md);
      display: none;
      font-size: 14px;
    }
    .toast.show { display: block; }

    /* Motion Safety */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="container" id="main-content" role="main">
    <!-- Header -->
    <header>
      <div class="title-group">
        <h1>Mission Control</h1>
        <p>Telemetry, deployments, and interface tasks</p>
      </div>
      <button class="btn btn-primary" id="action-btn" aria-label="Trigger quick deployment">
        Deploy Release v1.4
      </button>
    </header>

    <!-- Metrics Cards (8pt Grid Layout) -->
    <section class="metrics-grid" aria-label="System Metrics">
      <div class="metric-card">
        <div class="label">API Health</div>
        <div class="value">99.98%</div>
        <div class="trend positive">▲ 0.12% vs last week</div>
      </div>
      <div class="metric-card">
        <div class="label">P95 Latency</div>
        <div class="value">42ms</div>
        <div class="trend positive">▲ 4ms faster</div>
      </div>
      <div class="metric-card">
        <div class="label">Error Budget</div>
        <div class="value">84.2%</div>
        <div class="trend warning">▼ 2.1% consumption</div>
      </div>
    </section>

    <!-- Tasks List Section -->
    <section class="section-card" aria-labelledby="tasks-heading">
      <div class="section-header">
        <h2 id="tasks-heading">Production Checkpoints</h2>
        <button class="btn btn-secondary" id="filter-btn">
          Filter Completed
        </button>
      </div>

      <ul class="task-list" role="list">
        <li class="task-item">
          <div class="task-left">
            <div class="checkbox-wrapper">
              <input type="checkbox" id="task-1" aria-label="Mark WCAG 2.2 AA Contrast Audit complete">
            </div>
            <label for="task-1" class="task-label">WCAG 2.2 AA Contrast Audit</label>
          </div>
          <span class="badge badge-high">High</span>
        </li>

        <li class="task-item">
          <div class="task-left">
            <div class="checkbox-wrapper">
              <input type="checkbox" id="task-2" aria-label="Mark Touch Target Ergonomics check complete">
            </div>
            <label for="task-2" class="task-label">Touch Target Ergonomics (44px min)</label>
          </div>
          <span class="badge badge-med">Medium</span>
        </li>

        <li class="task-item">
          <div class="task-left">
            <div class="checkbox-wrapper">
              <input type="checkbox" id="task-3" aria-label="Mark Focus Rings and Keyboard Trap Prevention complete">
            </div>
            <label for="task-3" class="task-label">Focus Rings & Keyboard Escape Handlers</label>
          </div>
          <span class="badge badge-med">Medium</span>
        </li>
      </ul>
    </section>
  </div>

  <!-- Live region for screen readers and UI feedback -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // State handling adhering to UX Heuristic 1 (Instant system status)
    const toast = document.getElementById('toast');
    const actionBtn = document.getElementById('action-btn');

    function notify(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    actionBtn.addEventListener('click', () => {
      notify('Deployment v1.4 started successfully.');
    });

    // Checkbox toggle logic
    document.querySelectorAll('.task-item input[type="checkbox"]').forEach(chk => {
      chk.addEventListener('change', (e) => {
        const item = e.target.closest('.task-item');
        if (e.target.checked) {
          item.classList.add('completed');
          notify('Checkpoint marked complete');
        } else {
          item.classList.remove('completed');
        }
      });
    });

    // Keyboard escape listener (UX Heuristic 3)
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        toast.classList.remove('show');
      }
    });
  </script>
</body>
</html>
